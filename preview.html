<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Liquid Glass — profile preview</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0f17;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf2ff}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:22px}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  img{display:block;max-width:100%;height:auto}
  .full{width:100%}
  .badge{width:170px}
  .tile{width:140px}
  .hint{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#61738f;margin:10px 0 -6px}
  @media (max-width:520px){.wrap{padding:18px 14px 40px;gap:16px}.badge{width:calc(50% - 11px)}}
</style>
</head>
<body>
<div class="wrap">
  <img class="full" src="assets/hero.svg" alt="hero"/>
  <img class="full" src="assets/marquee.svg" alt="marquee"/>

  <img class="full" src="assets/sec-about.svg" alt="about header"/>
  <img class="full" src="assets/sec-journey.svg" alt="journey header"/>
  <img class="full" src="assets/sec-stack.svg" alt="stack header"/>
  <img class="full" src="assets/stack.svg" alt="stack"/>

  <img class="full" src="assets/sec-work.svg" alt="work header"/>
  <img class="full" src="assets/featured-matfess.svg" alt="featured project"/>

  <img class="full" src="assets/sec-lab.svg" alt="github lab header"/>
  <img class="full" src="assets/github-stats.svg" alt="github signal"/>
  <img class="full" src="assets/github-stats-mobile.svg" alt="github signal, mobile variant" style="max-width:420px"/>

  <div class="row">
    <img class="tile" src="assets/hobby-camera.svg" alt="photography"/>
    <img class="tile" src="assets/hobby-leaf.svg" alt="urban farming"/>
    <img class="tile" src="assets/hobby-film.svg" alt="short film"/>
    <img class="tile" src="assets/hobby-pen.svg" alt="design"/>
  </div>

  <img class="full" src="assets/sec-connect.svg" alt="connect header"/>
  <div class="row">
    <img class="badge" src="assets/social/instagram.svg" alt="instagram"/>
    <img class="badge" src="assets/social/linkedin.svg" alt="linkedin"/>
    <img class="badge" src="assets/social/github.svg" alt="github"/>
    <img class="badge" src="assets/social/tiktok.svg" alt="tiktok"/>
    <img class="badge" src="assets/social/x.svg" alt="x"/>
    <img class="badge" src="assets/social/youtube.svg" alt="youtube"/>
    <img class="badge" src="assets/social/pinterest.svg" alt="pinterest"/>
    <img class="badge" src="assets/social/threads.svg" alt="threads"/>
    <img class="badge" src="assets/social/discord.svg" alt="discord"/>
    <img class="badge" src="assets/social/brainly.svg" alt="brainly"/>
  </div>

  <img class="full" src="assets/footer.svg" alt="footer"/>
</div>
</body>
</html>
