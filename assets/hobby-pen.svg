<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none" role="img"><defs>
<linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".105"/>
  <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".045"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity=".018"/>
</linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
  <stop offset=".28" stop-color="#BBD7FF" stop-opacity=".18"/>
  <stop offset=".62" stop-color="#FFFFFF" stop-opacity=".07"/>
  <stop offset="1" stop-color="#7DD3FC" stop-opacity=".34"/>
</linearGradient>
<linearGradient id="rimSoft" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
  <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/>
</linearGradient>
<linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".55"/>
  <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
  <stop offset=".82" stop-color="#FFFFFF" stop-opacity=".55"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".16"/>
  <stop offset=".5" stop-color="#E4F1FF" stop-opacity=".34"/>
  <stop offset=".58" stop-color="#FFFFFF" stop-opacity=".14"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/>
  <stop offset=".34" stop-color="#E8F2FF"/>
  <stop offset=".62" stop-color="#A9CBFF"/>
  <stop offset="1" stop-color="#C9B8FF"/>
  <animate attributeName="x1" values="-0.2;0.4;-0.2" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0.8;1.4;0.8" dur="12s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gridStroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#D6E6FF" stop-opacity=".10"/>
  <stop offset="1" stop-color="#8FB4FF" stop-opacity=".02"/>
</linearGradient>
<radialGradient id="vignette" cx=".5" cy=".34" r=".92">
  <stop offset=".42" stop-color="#000000" stop-opacity="0"/>
  <stop offset="1" stop-color="#000000" stop-opacity=".58"/>
</radialGradient>
<radialGradient id="glowWhite" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
  <stop offset=".35" stop-color="#CFE6FF" stop-opacity=".28"/>
  <stop offset="1" stop-color="#CFE6FF" stop-opacity="0"/>
</radialGradient>
<filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="14" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#05080F"/>
  <stop offset=".42" stop-color="#080D1A"/>
  <stop offset=".74" stop-color="#0A1020"/>
  <stop offset="1" stop-color="#05080F"/>
</linearGradient>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
  <path d="M56 0H0V56" fill="none" stroke="url(#gridStroke)" stroke-width="1"/>
</pattern>
<radialGradient id="gridMaskGrad" cx=".5" cy=".45" r=".62">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
  <stop offset=".7" stop-color="#FFFFFF" stop-opacity=".35"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<mask id="gridMask"><rect width="140" height="140" fill="url(#gridMaskGrad)"/></mask>

<radialGradient id="og1" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#FCD34D" stop-opacity="0.400"/>
  <stop offset=".45" stop-color="#FCD34D" stop-opacity="0.152"/>
  <stop offset="1" stop-color="#FCD34D" stop-opacity="0"/>
</radialGradient>
<radialGradient id="og2" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#FCD34D" stop-opacity="0.220"/>
  <stop offset=".45" stop-color="#FCD34D" stop-opacity="0.084"/>
  <stop offset="1" stop-color="#FCD34D" stop-opacity="0"/>
</radialGradient><clipPath id="clip3"><rect x="0" y="0" width="140" height="140" rx="36"/></clipPath></defs><style>
.fl-a{animation:flA 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl-b{animation:flB 11s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl-c{animation:flC 13s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.orbit{animation:spinSlow 46s linear infinite;transform-box:fill-box;transform-origin:center}
.orbit-rev{animation:spinSlow 64s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.dotpulse{animation:dotPulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rot{opacity:0;animation:rot 13s cubic-bezier(.42,0,.2,1) infinite}
.mq{animation:mq 30s linear infinite;transform-box:fill-box}
.mq-rev{animation:mqRev 36s linear infinite;transform-box:fill-box}
.breath{animation:breath 6s ease-in-out infinite}
@keyframes flA{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes flB{0%,100%{transform:translateY(0)}50%{transform:translateY(13px)}}
@keyframes flC{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-11px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(.82)}50%{opacity:1;transform:scale(1.18)}}
@keyframes rot{0%{opacity:0}3%{opacity:1}21%{opacity:1}24%{opacity:0}100%{opacity:0}}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mqRev{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes breath{0%,100%{opacity:.42}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.fl-a,.fl-b,.fl-c,.orbit,.orbit-rev,.dotpulse,.rot,.mq,.mq-rev,.breath{animation:none!important}}
</style><rect width="140" height="140" rx="36" fill="url(#bgGrad)"/><g class="fl-a"><ellipse cx="30" cy="10" rx="130" ry="106.6" fill="url(#og1)"/></g><g class="fl-b"><ellipse cx="120" cy="140" rx="120" ry="98.4" fill="url(#og2)"/></g><rect width="140" height="140" rx="36" fill="url(#vignette)"/><rect width="140" height="140" rx="36" filter="url(#grain)" opacity=".035"/><rect x="0.6" y="0.6" width="138.8" height="138.8" rx="35.4" fill="none" stroke="url(#rimSoft)" stroke-width="1.2" opacity="1" /><rect x="0" y="0" width="140" height="140" rx="36" fill="url(#glass)" stroke="none" stroke-width="1" opacity="1.0" /><rect x="0.3" y="0.3" width="139.4" height="139.4" rx="36" fill="none" stroke="url(#rim)" stroke-width="1.1" opacity="1" /><path d="M 36 1.1 H 104" stroke="url(#topLine)" stroke-width="1.2" opacity=".7"/><g clip-path="url(#clip3)"><rect x="-90" y="-40" width="90" height="220" fill="url(#sheen)" opacity=".55"><animate attributeName="x" from="-90" to="230" dur="9s" begin="0s" repeatCount="indefinite"/></rect></g><circle cx="70" cy="64" r="40" fill="#FCD34D" opacity=".10"/><g transform="translate(34 34) scale(3)" stroke="#FCD34D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".95"><path d="M12.5 20H21"/><path d="M16.6 3.4a2.2 2.2 0 0 1 3.1 3.1L7.4 18.8 3.2 20l1.2-4.2z"/></g><text x="70" y="122" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9" font-weight="400" fill="#61738F" letter-spacing="2.4" text-anchor="middle" opacity="1" class="" style="">04</text></svg>