name: Refresh GitHub signal

# Rebuilds assets/github-stats.svg + assets/github-stats.json from the live
# GitHub API and the public contribution calendar, then commits the result.
# The card therefore never depends on a third-party image host.

on:
  schedule:
    - cron: "17 3 * * *"        # every day, 03:17 UTC (10:17 WIB)
  workflow_dispatch:            # or run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_stats.py

      - name: Commit the new card
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-stats-mobile.svg assets/github-stats.json
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "chore: refresh github-stats.svg"
            git push
          fi
