name: Generate Snake

# Menghasilkan ulang animasi ular kontribusi lalu mendorongnya ke branch `output`.
# README memuat SVG dari branch itu, jadi tidak ada file biner yang masuk ke `main`.

on:
  schedule:
    - cron: "0 */12 * * *"   # tiap 12 jam (00:00 & 12:00 UTC)
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Generate contribution snake
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # warna disamakan dengan palet Liquid Glass (cyan → biru), bukan hijau GitHub
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3d7fd9&color_dots=#ebedf0,#c9e9f6,#93d5ec,#4fb6d8,#1a8fb8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#6EA8FF&color_dots=#151c2b,#123a4a,#17566e,#1e7e9c,#67E8F9

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
